repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        # run only on staged files by default; avoid forcing full-tree scan which
        # can be slow when running `--all-files` manually. Use `pre-commit run ruff --all-files`
        # explicitly when full repo check is desired.

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        files: ^src/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        # Limit bandit to production code only to avoid false-positives in tests
        # (tests commonly use `assert`). This runs bandit only on files under src/.
        files: ^src/
        args: ["-q", "-s", "B104,B404,B603"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: ["src", "--min-confidence=60"]
        pass_filenames: false
        always_run: false
        stages: [manual]

  - repo: local
    hooks: []
