[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
	".venv",
	"**/__pycache__",
	"data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
## Removed E501 from ignore to enforce line-length checks in CI


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
markers = [
	"integration: marks tests as integration (requires external services like Postgres)",
]

[tool.isort]
profile = "black"
line_length = 120

# organização
force_sort_within_sections = true
combine_as_imports = true
order_by_type = false

# seções de import
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]

# seu pacote principal
known_first_party = ["infra_monitoring"]

# ignorar pastas
skip = ["migrations","venv",".venv","build","dist"]

# estilo
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = 3.11

strict = true

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# Run mypy from repo root; keep it focused.
files = ["src"]
exclude = [
	"^\\.venv/",
	"^data/",
]
