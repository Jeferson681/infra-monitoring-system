[pytest]
minversion = 7.0

# Allow running `pytest` from inside infra/terraform without breaking collection.
# This is intentionally local and didactic: it just points back to the repo tests/src.

testpaths = ../../tests
python_files = test_*.py

addopts = -q --cov=../../src --cov-report=term-missing --cov-fail-under=0 --maxfail=5 --disable-warnings -v
pythonpath =
    ../..
    ../../src

norecursedirs = ../../tests/archive_pre_reorg ../../archive_pre_reorg

markers =
    slow: marks tests as slow
