services:
  infra-monitoring-system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: infra-monitoring-system_app
    command: python -m src.main
    env_file:
      - ../.env
    environment:
      # Control program execution and exposition behavior via MONITORING_* envs
      - MONITORING_HTTP_ENABLE=0
      - MONITORING_HTTP_PORT=8000
      - MONITORING_PROMTAIL_ENABLE=1
      - MONITORING_CYCLES=0
    volumes:
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../.cache:/app/.cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # depends_on removido pois o serviço de métricas foi excluído

  main_http:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: infra-monitoring-main-http
    command: python -u -m infra_monitoring.api.exporter.main_http
    env_file:
      - ../.env
    environment:
      - MONITORING_HTTP_ADDR=0.0.0.0
      - MONITORING_HTTP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs:ro
      - ../.cache:/app/.cache:ro
    restart: unless-stopped
    depends_on:
      - infra-monitoring-system
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ../logs:/logs:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  promtail-positions:
