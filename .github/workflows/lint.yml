name: Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and install deps
        uses: ./.github/actions/setup-deps
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        if: exists('requirements-dev.txt')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run lint (ruff, flake8, black)
        run: |
          ruff check src tests
          flake8 src/ tests/
          black --check src/ tests/


      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (security)
        run: bandit -r src/ --skip B404,B603,B104

      - name: Notify success on Discord (Lint)
        if: ${{ success() }}
        uses: ./.github/actions/notify-discord
        with:
          payload: "{\"content\": \"✅ Lint passed: ${{ github.workflow }} on ${{ github.ref_name }} (run #${{ github.run_number }})\"}"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify failure on Discord (Lint)
        if: ${{ failure() }}
        uses: ./.github/actions/notify-discord
        with:
          payload: "{\"content\": \"❌ Lint failed: ${{ github.workflow }} on ${{ github.ref_name }} (run #${{ github.run_number }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
