name: Tests & Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Setup and install deps
        uses: ./.github/actions/setup-deps
        with:
          python-version: '3.13'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest-cov
      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings --cov=src --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

      - name: Notify success on Discord (Tests & Coverage)
        if: ${{ success() }}
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"✅ Tests & Coverage passed: ${{ github.workflow }} on ${{ github.ref_name }} (run #${{ github.run_number }})\"}" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            echo "DISCORD_WEBHOOK_URL not set; skipping notification."
          fi

      - name: Notify failure on Discord (Tests & Coverage)
        if: ${{ failure() }}
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"❌ Tests & Coverage failed: ${{ github.workflow }} on ${{ github.ref_name }} (run #${{ github.run_number }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            echo "DISCORD_WEBHOOK_URL not set; skipping notification."
          fi
