name: Snyk Vulnerability Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check SNYK token
        id: check_snyk
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
      
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Snyk for Python
        if: ${{ steps.check_snyk.outputs.enabled == 'true' }}
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - name: Run Snyk for Docker
        if: ${{ github.event_name == 'push' && steps.check_snyk.outputs.enabled == 'true' }}
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock snyk/snyk:latest container test ${{ secrets.DOCKER_USERNAME }}/infra-monitoring-system:latest --severity-threshold=high || true
          else
            echo "DOCKER_USERNAME not set; skipping Snyk docker scan."
          fi
        shell: bash
