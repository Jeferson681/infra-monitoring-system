name: Trivy image scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: infra-monitoring-system:ci-scan

      - name: Resolve openssl version for hadolint
        run: |
          # Resolve candidate openssl version using a minimal Debian container (POSIX sh)
          ver=$(docker run --rm debian:bookworm-slim sh -c "apt-get update >/dev/null && apt-cache madison openssl | awk 'NR==1{print \$3}'")
          echo "Resolved openssl version: $ver"
          if [ -z "$ver" ]; then
            echo "ERROR: could not resolve openssl version; aborting hadolint preparation" >&2
            exit 1
          fi
          echo "VER=$ver" >> $GITHUB_ENV

      - name: Prepare Dockerfile for hadolint (pin openssl)
        run: |
          cp Dockerfile Dockerfile.hadolint
          # Replace dynamic version-resolution block with a pinned install line so hadolint DL3008 is satisfied
          awk -v v="$VER" '
            BEGIN { skip=0 }
            /apt-cache madison openssl/ { skip=1; next }
            skip==1 && /rm -rf \/var\/lib\/apt\/lists\/*/ {
              # insert pinned install before cleaning apt lists
              print "\tapt-get install -y --no-install-recommends openssl=" v "; \\";
              print $0
              skip=0
              next
            }
            skip==0 { print }
          ' Dockerfile > Dockerfile.hadolint.tmp && mv Dockerfile.hadolint.tmp Dockerfile.hadolint
          echo '--- Dockerfile.hadolint (head) ---'
          sed -n '1,120p' Dockerfile.hadolint || true

      - name: Run hadolint (Dockerfile lint)
        run: |
          docker run --rm -v "${{ github.workspace }}":/data -w /data hadolint/hadolint:latest hadolint Dockerfile.hadolint || (
            echo 'Hadolint reported issues. Showing Dockerfile.hadolint for inspection:' >&2;
            sed -n '1,240p' Dockerfile.hadolint >&2 || true;
            rm -f Dockerfile.hadolint; exit 1
          )
          rm -f Dockerfile.hadolint

      - name: Trivy scan image
        run: |
          # debug: list images to confirm the built image is present
          docker images | sed -n '1,200p'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest image --format table --severity CRITICAL,HIGH infra-monitoring-system:ci-scan
