name: CD

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      run_production:
        description: 'Set to true to actually run the production deploy (default: false)'
        required: false
        default: 'false'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and (optionally) push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # Only push to the registry for protected branches (main/master).
          push: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/infra-monitoring-system:latest
            ${{ secrets.DOCKER_USERNAME }}/infra-monitoring-system:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/infra-monitoring-system:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/infra-monitoring-system:${{ github.ref_name }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy container local com Docker
        run: |
          sudo service docker start || true
          docker compose version
          docker compose -f docker/docker-compose.yml pull || echo "Falha ao puxar imagens, verifique permissões e rede."
          docker compose -f docker/docker-compose.yml up -d --build || echo "Falha ao subir containers, verifique logs."
      - name: Notify success on Discord (staging)
        if: ${{ success() }}
        uses: ./.github/actions/notify-discord
        with:
          payload: "{\"content\": \"✅ Deploy to STAGING succeeded: ${{ github.repository }} on ${{ github.ref_name }} (run #${{ github.run_number }})\"}"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Notify failure on Discord (staging)
        if: ${{ failure() }}
        uses: ./.github/actions/notify-discord
        with:
          payload: "{\"content\": \"❌ Deploy to STAGING failed: See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-production:
    # Production deploy is manual for portfolio safety. Run via "Run workflow" in Actions
    # to avoid accidental production changes from PRs or automated pushes.
    # This job is restricted to manual runs on `main` and will only execute when
    # the workflow_dispatch input `run_production` is set to 'true'. By default
    # the input is 'false' so production deploys are skipped.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.run_production == 'true'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Para ativar o deploy real, descomente as linhas abaixo e configure os secrets necessários
      # - name: Configure AWS credentials (prod)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
      #     aws-region: us-east-1
      # - name: Deploy to Amazon ECS (prod)
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: ecs-task-def-prod.json
      #     service: my-ecs-service-prod
      #     cluster: my-ecs-cluster-prod
      #     wait-for-service-stability: true
