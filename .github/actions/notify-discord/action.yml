name: "Notify Discord"
description: "Send a message to a Discord webhook (if set in secrets)"
runs:
  using: "composite"
  steps:
    - name: Send message to Discord
      shell: bash
      run: |
        if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
          curl -H "Content-Type: application/json" \
            -d "${{ inputs.payload }}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
        else
          echo "DISCORD_WEBHOOK_URL not set; skipping notification. Message: ${{ inputs.payload }}"
        fi
inputs:
  payload:
    description: 'Full JSON payload to POST to the webhook'
    required: true
